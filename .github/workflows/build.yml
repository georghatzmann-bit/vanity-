name: Build Windows Setup

on:
  push:
    branches: [main, 'claude/**']
    # namespaced: this repository also hosts other apps' releases (Konto-Retter owns v1.x tags)
    tags: ['phoenix-v*']
  workflow_dispatch:

# Least privilege: the build job only reads. Only the tag-triggered release job may write.
permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      setup: ${{ steps.out.outputs.setup }}
      version: ${{ steps.out.outputs.version }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false' # never look for a signing certificate -> unsigned build
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Cache Electron + electron-builder downloads
        uses: actions/cache@v6
        with:
          # default cache dirs on Windows (Electron zip via @electron/get, NSIS/7zip via electron-builder)
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      # The restore-only scripts run under Windows PowerShell 5.1, which rejects some pwsh 7 syntax.
      - name: PowerShell 5.1 parse check
        shell: pwsh
        run: |
          $env:PWSH = 'powershell.exe'
          node scripts/check-ps.mjs

      - name: Use tag as app version (phoenix-v1.2.3 -> 1.2.3)
        if: startsWith(github.ref, 'refs/tags/phoenix-v')
        shell: pwsh
        run: npm version ($env:GITHUB_REF_NAME -replace '^phoenix-v','') --no-git-tag-version --allow-same-version

      # Every test build gets its own version: Setup file name, artifact, Apps & Features, UAC dialog
      # and the log line "Phoenix x.y.z gestartet" then tell the builds apart.
      - name: Unique version for CI test builds
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: pwsh
        run: npm version "1.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version

      - name: Build renderer (Vite)
        run: npm run build:renderer

      - name: Build NSIS installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Verify package contents
        run: node scripts/verify-dist.mjs

      - name: Locate Setup.exe
        id: out
        shell: pwsh
        run: |
          $exe = Get-ChildItem release -Filter 'Phoenix-Setup-*.exe' -File | Select-Object -First 1
          if (-not $exe) { throw 'Phoenix-Setup-*.exe not found in release/' }
          "{0}  {1:N1} MiB" -f $exe.Name, ($exe.Length / 1MB)
          "setup=$($exe.Name)" >> $env:GITHUB_OUTPUT
          "version=$((Get-Content package.json -Raw | ConvertFrom-Json).version)" >> $env:GITHUB_OUTPUT

      - name: Upload Setup.exe as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          path: release/${{ steps.out.outputs.setup }}
          archive: false # upload the .exe itself (artifact name = file name)
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/phoenix-v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub Release
    steps:
      - name: Download Setup.exe
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.setup }}
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Phoenix ${{ needs.build.outputs.version }}
          files: release/${{ needs.build.outputs.setup }}
          # other apps' releases live in this repository too: never take "Latest" from them and
          # never diff release notes against their tags
          make_latest: false
          generate_release_notes: false
          fail_on_unmatched_files: true
          body: |
            Phoenix sichert vor dem Windows-Reset die Liste deiner Apps und Spiele und installiert sie danach wieder.

            1. `${{ needs.build.outputs.setup }}` unten bei *Assets* herunterladen und starten. Bei „Der Computer wurde durch Windows geschützt“: **Weitere Informationen** → **Trotzdem ausführen**.
            2. Die Windows-Abfrage nach Administratorrechten mit **Ja** bestätigen.
            3. Nach dem Reset in Phoenix **Wiederherstellen** wählen → Profil vom USB-Stick wählen → Apps anhaken → los.

            Liegt auf deinem Stick noch ein älteres `Phoenix-Setup-*.exe`, nimm dieses neuere Setup.
