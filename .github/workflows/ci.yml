name: CI

on:
  push:
    branches: ['main', 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Lieferkette: Jede Action ist auf einen vollen Commit-SHA gepinnt (Tags und Branches sind
# veränderlich), der Kommentar nennt die Version. Aktualisieren: Release prüfen, SHA mit
# `git ls-remote --tags https://github.com/<owner>/<repo>` holen (bei annotierten Tags den
# `^{}`-Wert). apps/desktop/tests/ci-workflow.test.ts erzwingt Pins, `--locked`, Timeouts und
# Clippy auch für Release-Code (`cfg(not(debug_assertions))`) und alle Features.
jobs:
  frontend:
    name: Frontend (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Playwright-Browser installieren
        run: pnpm --filter @aegis/desktop exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: apps/desktop/playwright-report
          retention-days: 7

  rust-linux:
    name: Rust (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tauri-Abhängigkeiten
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-08 (inkl. #187)
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      # Debug-Profil (cfg(debug_assertions)) und Release-Profil mit allen Features: Code, der
      # nur im Release-Build oder hinter einem Feature steckt, wird sonst nie gelintet.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features --release --locked -- -D warnings
      - run: cargo clippy --workspace --exclude aegis-desktop --exclude aegis-browser --exclude aegis-setup --all-targets --target x86_64-pc-windows-msvc --locked -- -D warnings
      - run: cargo clippy --workspace --exclude aegis-desktop --exclude aegis-browser --exclude aegis-setup --all-targets --all-features --release --target x86_64-pc-windows-msvc --locked -- -D warnings
      - run: cargo test --workspace --locked
      # Swatinem/rust-cache (bis einschließlich v2.9.2) räumt target/tests/target ohne `await`
      # auf und meldet ein fehlendes Verzeichnis als ##[error] (trybuild legt nur
      # target/tests/trybuild an). Mit leeren Ordnern läuft das Aufräumen sauber durch.
      - name: rust-cache-Aufräumen vorbereiten
        if: always()
        shell: bash
        run: mkdir -p target/tests/target target/tests/trybuild

  windows:
    name: Windows (Build + Tests + NSIS)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-08 (inkl. #187)
        with:
          toolchain: 1.97.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: pnpm install --frozen-lockfile
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features --release --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: pnpm test
      # Das Installationsprogramm bringt Dienst, Prüfprozess, Labor-Sonde, Tresor-Host und die Erweiterungen
      # mit (apps/desktop/src-tauri/windows/hooks.nsh) – vorher bauen.
      - name: Dienst, Host und Erweiterungen bauen
        run: |
          cargo build --release --locked -p aegis-service -p aegis-vault-host -p aegis-sandbox --bins
          pnpm --filter @aegis/vault-extension --filter @aegis/webshield build
      # Argumente nach `--` reicht die Tauri-CLI an `cargo build` weiter.
      - name: Tauri-Build (NSIS)
        run: pnpm --filter @aegis/desktop tauri build -- --locked
      - name: Browser bauen (NSIS)
        run: pnpm --filter @aegis/browser tauri build -- --locked
      # AEGIS-Setup.exe als Offline-Setup: Die Installationsprogramme von App und Browser
      # werden eingebettet (apps/setup/src-tauri/build.rs) – eine einzige Datei, kein Download.
      - name: Setup mit eingebetteten Paketen bauen
        shell: bash
        run: |
          mkdir -p target/setup-payload target/publish
          cp target/release/bundle/nsis/AEGIS\ Suite_*_x64-setup.exe target/setup-payload/aegis-suite-setup.exe
          cp target/release/bundle/nsis/AEGIS\ Browser_*_x64-setup.exe target/setup-payload/aegis-browser-setup.exe
          export AEGIS_SETUP_PAYLOAD_DIR="$(cygpath -w "$PWD/target/setup-payload")"
          pnpm --filter @aegis/setup tauri build -- --locked
          cp target/release/aegis-setup.exe target/publish/AEGIS-Setup.exe
          cp target/setup-payload/aegis-suite-setup.exe target/publish/AEGIS-Suite-x64-setup.exe
          cp target/setup-payload/aegis-browser-setup.exe target/publish/AEGIS-Browser-x64-setup.exe
          ls -l target/publish
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aegis-windows-nsis
          path: target/publish/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: rust-cache-Aufräumen vorbereiten
        if: always()
        shell: bash
        run: mkdir -p target/tests/target target/tests/trybuild

  # Testversion zum direkten Herunterladen (GitHub-Release „testversion“, Vorabversion) – vom
  # Nutzer ausdrücklich gewünscht. Nur nach grünen Jobs und nur bei Push auf die eigenen
  # Zweige. Eigener Job mit Schreibrecht nur für Releases: Er baut nichts und führt keinen Code
  # aus dem Repository aus, er lädt nur das geprüfte Artefakt dieses Laufs hoch.
  publish:
    name: Testversion veröffentlichen
    needs: [frontend, rust-linux, windows]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Release „testversion“ aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          gh run download "$RUN_ID" --repo "$REPO" --name aegis-windows-nsis --dir dist
          ls -l dist
          notes="Testversion (unsigniert) – Stand ${SHA}.

          **AEGIS-Setup.exe** herunterladen und starten: Die Datei enthält alles (AEGIS Suite, auf Wunsch den AEGIS Browser) und installiert ohne weiteren Download.

          Ehrlich: Ohne Code-Signing-Zertifikat warnt Windows SmartScreen („Weitere Informationen → Trotzdem ausführen“). Windows fragt einmal nach Administratorrechten (Schutzdienst)."
          if gh release view testversion --repo "$REPO" >/dev/null 2>&1; then
            gh release edit testversion --repo "$REPO" --prerelease --notes "$notes"
          else
            gh release create testversion --repo "$REPO" --target "$SHA" --prerelease \
              --title "AEGIS Suite – Testversion" --notes "$notes"
          fi
          gh release upload testversion dist/*.exe --repo "$REPO" --clobber
