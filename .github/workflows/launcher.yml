# Baut den Vanity-Launcher aus dem Quellcode.
# 1. Prüfen: TypeScript-Typen + Oberfläche bauen (schnell, Linux)
# 2. Windows: fertigen Installer (.exe) bauen und als „Artifact“ zum Herunterladen ablegen
name: Launcher

on:
  push:
    paths:
      - "launcher/**"
      - ".github/workflows/launcher.yml"
  pull_request:
    paths:
      - "launcher/**"
      - ".github/workflows/launcher.yml"
  workflow_dispatch:

concurrency:
  group: launcher-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: launcher

jobs:
  check:
    name: Oberfläche prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: launcher/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: launcher/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Typen prüfen
        run: pnpm typecheck
      - name: Oberfläche bauen
        run: pnpm build

  windows:
    name: Windows-Installer bauen
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: launcher/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: launcher/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - name: Installer bauen
        run: pnpm tauri build
      - name: Installer hochladen
        uses: actions/upload-artifact@v6
        with:
          name: Vanity-Installer-${{ github.sha }}
          path: launcher/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
