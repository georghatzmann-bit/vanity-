# Baut JarvisSetup.exe auf Windows, installiert sie dort einmal still zur Probe
# und stellt sie als Release bereit (Seite "Releases" > neueste Version).
name: JarvisSetup.exe bauen

on:
  push:
    branches: [main, claude/project-thread-0revfw]
    paths:
      - "jarvis/**"
      - "jarvis_home/**"
      - "werkzeuge/**"
      - "installer/**"
      - "requirements*.txt"
      - "Jarvis.bat"
      - "Jarvis.pyw"
      - "config.example.toml"
      - "ANLEITUNG.md"
      - "README.md"
      - ".github/workflows/setup-exe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup-exe:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version
        shell: pwsh
        run: |
          $v = (python -c "import jarvis; print(jarvis.__version__)").Trim()
          "JARVIS_VERSION=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Symbol
        run: |
          python -m pip install --quiet pillow
          python -c "from jarvis.tray import save_app_icon; save_app_icon('installer/jarvis.ico')"

      - name: Inno Setup
        run: choco install innosetup -y --no-progress

      - name: JarvisSetup.exe bauen
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\jarvis.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: JarvisSetup
          path: installer/Output/JarvisSetup.exe

      - name: Probe-Installation (still)
        shell: pwsh
        run: |
          $p = Start-Process installer\Output\JarvisSetup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=setup.log" -PassThru -Wait
          Write-Host "Installer beendet mit $($p.ExitCode)"
          Get-Content "$env:LOCALAPPDATA\Jarvis\installation.log" -ErrorAction SilentlyContinue | Select-Object -Last 40
          if ($p.ExitCode -ne 0) { Get-Content setup.log -Tail 60; exit 1 }
          if (-not (Test-Path "$env:LOCALAPPDATA\Jarvis\venv\Scripts\pythonw.exe")) { Write-Host "venv fehlt"; exit 1 }

      - name: Probe-Start
        shell: pwsh
        run: |
          $py = "$env:LOCALAPPDATA\Jarvis\venv\Scripts\python.exe"
          $app = "$env:LOCALAPPDATA\Programs\Jarvis"
          & $py -c "import webview, sounddevice, numpy, faster_whisper, openwakeword, edge_tts, miniaudio, pystray, psutil; print('Kern-Pakete OK')"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $py -c "import piper; print('Offline-Stimme OK')"
          Push-Location $app
          & $py -m jarvis --selbsttest --schnell
          Write-Host "Selbsttest beendet mit $LASTEXITCODE (ohne Mikrofon und Claude sind Fehler dort normal)"
          Get-Content logs\selbsttest.txt -ErrorAction SilentlyContinue
          Pop-Location
          exit 0

      - name: Probe Windows-Einbindung (Hintergrund, Anzeige, zweiter Start)
        shell: pwsh
        run: |
          $py = "$env:LOCALAPPDATA\Jarvis\venv\Scripts\python.exe"
          $pyw = "$env:LOCALAPPDATA\Jarvis\venv\Scripts\pythonw.exe"
          $app = "$env:LOCALAPPDATA\Programs\Jarvis"
          $run = (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name Jarvis -ErrorAction SilentlyContinue).Jarvis
          Write-Host "Autostart: $run"
          if (-not $run -or $run -notmatch "--hintergrund") { Write-Host "Autostart-Eintrag fehlt"; exit 1 }
          $lnk = Join-Path ([Environment]::GetFolderPath("Programs")) "Jarvis.lnk"
          if (-not (Test-Path $lnk)) { Write-Host "Startmenue-Verknuepfung fehlt"; exit 1 }
          $l = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk)
          Write-Host "Verknuepfung: $($l.TargetPath) $($l.Arguments) in $($l.WorkingDirectory)"
          Push-Location $app
          $env:PROBE_OUT = "$env:GITHUB_WORKSPACE\probe-bilder"
          & $py "$env:GITHUB_WORKSPACE\installer\probe.py"
          $probe = $LASTEXITCODE
          # Wie der Autostart: unsichtbar starten. Danach ein zweiter Start (Doppelklick
          # aufs Symbol): der muss sich sofort beenden und das Fenster des ersten zeigen.
          New-Item -ItemType Directory -Force daten | Out-Null
          Set-Content daten\einrichtung-fertig.txt "probe"
          $first = Start-Process $pyw -ArgumentList "`"$app\Jarvis.pyw`"", "--hintergrund" -PassThru
          Start-Sleep -Seconds 30
          if ($first.HasExited) { Write-Host "Jarvis hat sich beendet (Code $($first.ExitCode))"; Get-Content logs\jarvis.log -Tail 60; exit 1 }
          Write-Host "Jarvis laeuft unsichtbar (PID $($first.Id))"
          $second = Start-Process $pyw -ArgumentList "`"$app\Jarvis.pyw`"" -PassThru
          if (-not $second.WaitForExit(20000)) { Write-Host "Zweiter Start haengt"; Stop-Process -Id $second.Id -Force; $probe = 1 }
          else { Write-Host "Zweiter Start beendet mit $($second.ExitCode)" }
          Start-Sleep -Seconds 6
          & $py -c "from PIL import ImageGrab; ImageGrab.grab().save(r'$env:GITHUB_WORKSPACE\probe-bilder\fenster-nach-zweitem-start.png')"
          & $py "$env:GITHUB_WORKSPACE\installer\probe_fenster.py" $first.Id
          if ($LASTEXITCODE -ne 0) { $probe = 1 }
          if ($first.HasExited) { Write-Host "Jarvis ist beim zweiten Start abgestuerzt"; $probe = 1 }
          # Der venv-Starter und das eigentliche Python (sein Kind) beenden
          Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like '*Jarvis.pyw*' } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Write-Host "--- jarvis.log"
          Get-Content logs\jarvis.log -Tail 40 -ErrorAction SilentlyContinue
          Pop-Location
          exit $probe

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-bilder
          path: probe-bilder/
          if-no-files-found: ignore

      - name: Probe-Update (über ein laufendes Jarvis, wie bei Georg)
        shell: pwsh
        run: |
          $pyw = "$env:LOCALAPPDATA\Jarvis\venv\Scripts\pythonw.exe"
          $app = "$env:LOCALAPPDATA\Programs\Jarvis"
          $old = Start-Process $pyw -ArgumentList "`"$app\Jarvis.pyw`"", "--hintergrund" -WorkingDirectory $app -PassThru
          Start-Sleep -Seconds 20
          if ($old.HasExited) { Write-Host "Jarvis lief nicht (Code $($old.ExitCode))"; exit 1 }
          Write-Host "Jarvis laeuft (PID $($old.Id)), jetzt die neue Version drueber installieren"
          $p = Start-Process installer\Output\JarvisSetup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=update.log" -PassThru -Wait
          Write-Host "Installer beendet mit $($p.ExitCode)"
          $log = "$env:LOCALAPPDATA\Jarvis\installation.log"
          Get-Content $log -ErrorAction SilentlyContinue | Select-Object -Last 25
          if ($p.ExitCode -ne 0) { Get-Content update.log -Tail 60; exit 1 }
          if (-not (Select-String -Path $log -Pattern "^== Fertig" -Quiet)) { Write-Host "Die Bestandteile wurden nicht fertig installiert"; exit 1 }
          $left = Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like '*Jarvis.pyw*' }
          if ($left) {
            Write-Host "Das alte Jarvis laeuft noch: $($left.ProcessId -join ', ')"
            $left | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
            exit 1
          }
          Write-Host "Update ueber ein laufendes Jarvis: OK"

      - name: Probe lokale Stimme (wie der Knopf "Lokal einrichten")
        shell: pwsh
        timeout-minutes: 30
        run: |
          $py = "$env:LOCALAPPDATA\Jarvis\venv\Scripts\python.exe"
          $pyw = "$env:LOCALAPPDATA\Jarvis\venv\Scripts\pythonw.exe"
          $app = "$env:LOCALAPPDATA\Programs\Jarvis"
          Push-Location $app
          & $py -c "from jarvis.localvoice import install; ok, last = install(print); print('pip fertig:', ok); raise SystemExit(0 if ok else 1)"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $py -m jarvis.localvoice vorbereiten "$app\daten\stimmen"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $py -m jarvis.localvoice selbsttest
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Nach dem Einrichten müssen alle anderen Teile weiter laden (pocket-tts bringt numpy 2 und torch mit)
          & $py -c "import webview, sounddevice, numpy, faster_whisper, openwakeword, edge_tts, miniaudio, pystray, psutil, piper, torch, onnx_asr; print('Alle Pakete OK, numpy', numpy.__version__, 'torch', torch.__version__)"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Jarvis mit der lokalen Stimme starten: Sie muss im laufenden Jarvis laden
          & $py -c "from jarvis.config import save_setting; save_setting('tts', 'engine', 'lokal'); save_setting('stt', 'engine', 'lokal')"
          New-Item -ItemType Directory -Force daten | Out-Null
          Set-Content daten\einrichtung-fertig.txt "probe"
          $run = Start-Process $pyw -ArgumentList "`"$app\Jarvis.pyw`"", "--hintergrund" -WorkingDirectory $app -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 3
            if ($run.HasExited) { break }
            if (Select-String -Path logs\jarvis.log -Pattern "Lokale Stimme george bereit" -Quiet -ErrorAction SilentlyContinue) { $ok = $true; break }
          }
          Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like '*Jarvis.pyw*' } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Get-Content logs\jarvis.log -Tail 30 -ErrorAction SilentlyContinue
          Pop-Location
          if (-not $ok) { Write-Host "Die lokale Stimme hat im laufenden Jarvis nicht geladen"; exit 1 }
          Write-Host "Lokale Stimme im laufenden Jarvis: OK"

      - name: Probe-Deinstallation
        shell: pwsh
        run: |
          $uninst = "$env:LOCALAPPDATA\Programs\Jarvis\unins000.exe"
          $p = Start-Process $uninst -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -PassThru -Wait
          Write-Host "Deinstallation beendet mit $($p.ExitCode)"
          Start-Sleep -Seconds 3
          $run = (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name Jarvis -ErrorAction SilentlyContinue).Jarvis
          if ($run) { Write-Host "Autostart-Eintrag ist noch da"; exit 1 }
          if (Test-Path "$env:LOCALAPPDATA\Programs\Jarvis\jarvis") { Write-Host "Programmordner ist noch da"; exit 1 }
          Write-Host "Sauber deinstalliert"

      - name: Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jarvis-${{ env.JARVIS_VERSION }}-build${{ github.run_number }}
          name: Jarvis ${{ env.JARVIS_VERSION }} (Build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: installer/Output/JarvisSetup.exe
          body: |
            JarvisSetup.exe herunterladen und doppelklicken. Der Installer lädt alles Nötige selbst herunter.
            Windows fragt beim ersten Start vielleicht nach: "Weitere Informationen" und dann "Trotzdem ausführen".
