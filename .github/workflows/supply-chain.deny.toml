# cargo-deny-Richtlinie für die Rust-Abhängigkeiten der AEGIS Suite.
# Wird nur von .github/workflows/supply-chain.yml gelesen (`--config`), daher liegt sie hier.
# Lokal: cargo deny --manifest-path Cargo.toml --workspace --locked \
#          --config .github/workflows/supply-chain.deny.toml check

[graph]
# Ausgeliefert wird nur die Windows-App (x86_64). Die GTK-Kette von Tauri unter Linux
# (glib, proc-macro-error – RUSTSEC-2024-0429/-0370) dient nur Entwicklung/CI und gelangt
# nicht in den Windows-Build; sie wird deshalb hier nicht bewertet.
targets = ["x86_64-pc-windows-msvc"]
# Auch Code hinter optionalen Features (z. B. aegis-core/testing) zählt.
all-features = true
# Nur, was ausgeliefert wird: Dev-Abhängigkeiten (proptest, trybuild …) landen nicht im Installer.
exclude-dev = true

[advisories]
version = 2
# Sicherheitslücken, „unsound“ und „unmaintained“ schlagen fehl (Standard von Version 2);
# zurückgezogene Versionen ebenfalls. Ausnahmen nur mit Begründung und Ablaufdatum.
yanked = "deny"
ignore = [
  # yara-x 1.21 (neueste Version) verlangt wasmtime ^45; für die 45er-Reihe gibt es keine
  # Korrektur. Betroffen sind Komponentenmodell, async-Einstiege, WASI-Dateisystem und
  # mehrere Engines – YARA-X nutzt nichts davon: Es übersetzt nur unsere eigenen, vertrauten
  # Regeln in Wasm, ohne WASI. Gescannte Dateien sind Daten, kein Wasm-Code.
  # Erneut prüfen bei jedem yara-x-Update, spätestens 2027-01-31.
  { id = "RUSTSEC-2026-0222", reason = "wasmtime 45 via yara-x: mehrere Engines – nicht genutzt" },
  { id = "RUSTSEC-2026-0269", reason = "wasmtime 45 via yara-x: WASI-Dateisystem – nicht genutzt" },
  { id = "RUSTSEC-2026-0316", reason = "wasmtime 45 via yara-x: Komponentenmodell – nicht genutzt" },
  { id = "RUSTSEC-2026-0327", reason = "wasmtime 45 via yara-x: async-Komponenten – nicht genutzt" },
  { id = "RUSTSEC-2026-0359", reason = "wasmtime 45 via yara-x: Komponentenmodell-Typen – nicht genutzt" },
  { id = "RUSTSEC-2026-0362", reason = "wasmtime 45 via yara-x: async-Einstiege – nicht genutzt" },
  { id = "RUSTSEC-2026-0363", reason = "wasmtime 45 via yara-x: Komponentenmodell-Handles – nicht genutzt" },
  # rsa (Marvin): Zeitseitenkanal beim ENTschlüsseln mit privatem Schlüssel. YARA-X prüft mit
  # rsa nur Authenticode-Signaturen (öffentlicher Schlüssel) – kein Geheimnis im Spiel.
  { id = "RUSTSEC-2023-0071", reason = "rsa via yara-x pe-module: nur Signaturprüfung mit öffentlichem Schlüssel" },
  # bincode: nicht mehr gepflegt, aber ohne bekannte Lücke; von yara-x für Regel-Serialisierung.
  { id = "RUSTSEC-2025-0141", reason = "bincode via yara-x: ungepflegt, keine bekannte Lücke" },
]

[licenses]
version = 2
# Alles, was hier nicht steht, ist verboten – insbesondere GPL/LGPL/AGPL: ClamAV (GPL) wird
# nur als getrennter Prozess angesprochen, nie eingelinkt (CLAUDE.md, docs/LICENSES.md).
# MPL-2.0 (cssparser, selectors, dtoa-short, option-ext über Tauri) ist dateibezogenes
# Copyleft und mit dem Einlinken vereinbar.
allow = [
  "Apache-2.0",
  # Apache-2.0 mit LLVM-Ausnahme (wasmtime/cranelift via yara-x): nur zusätzliche Erlaubnis.
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.93
# Eigene Crates (publish = false) tragen keine Lizenzangabe.
private = { ignore = true }

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Pfad-Abhängigkeiten innerhalb des Workspaces sind erlaubt (nicht veröffentlicht).
allow-wildcard-paths = true
deny = [
  { crate = "clamav-sys", reason = "ClamAV ist GPL: nur als getrennter Prozess ansprechen, nie einlinken" },
  { crate = "clamav-rs", reason = "ClamAV ist GPL: nur als getrennter Prozess ansprechen, nie einlinken" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
