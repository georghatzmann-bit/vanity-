name: Lieferkette

on:
  push:
    branches: ['main', 'claude/**']
  pull_request:
  # Wöchentlich (Montag, 04:17 UTC): neue RustSec-/npm-Hinweise fallen auch ohne Code-Änderung auf.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Pins wie in ci.yml (voller Commit-SHA, Version im Kommentar).
jobs:
  cargo-deny:
    name: Rust-Abhängigkeiten (Hinweise, Lizenzen, Quellen)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_DENY_VERSION: 0.20.2
      # SHA-256 des offiziellen Release-Archivs (…-x86_64-unknown-linux-musl.tar.gz).
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-08 (inkl. #187)
        with:
          toolchain: 1.97.0
          targets: x86_64-pc-windows-msvc
      - name: cargo-deny installieren (Release-Archiv, SHA-256 geprüft)
        shell: bash
        run: |
          archive="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl --proto '=https' --tlsv1.2 --silent --show-error --fail --location --retry 3 \
            --output "${RUNNER_TEMP}/cargo-deny.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${archive}.tar.gz"
          echo "${CARGO_DENY_SHA256}  ${RUNNER_TEMP}/cargo-deny.tar.gz" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/cargo-deny"
          tar -xzf "${RUNNER_TEMP}/cargo-deny.tar.gz" -C "${RUNNER_TEMP}/cargo-deny" --strip-components=1 "${archive}/cargo-deny"
          echo "${RUNNER_TEMP}/cargo-deny" >> "${GITHUB_PATH}"
      - name: cargo deny (Windows-Build, alle Features, ohne Dev-Abhängigkeiten)
        run: cargo deny --manifest-path Cargo.toml --workspace --locked --config .github/workflows/supply-chain.deny.toml check advisories bans licenses sources

  pnpm-audit:
    name: npm-Abhängigkeiten (Hinweise)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Ausgeliefertes Bundle: ab „high“. Build-Werkzeuge (Vite, Tauri-CLI …) bauen den
      # Installer mit, daher zusätzlich alle Abhängigkeiten ab „critical“.
      - run: pnpm audit --prod --audit-level high
      - run: pnpm audit --audit-level critical
