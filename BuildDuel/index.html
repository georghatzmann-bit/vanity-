<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>BuildDuel</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="src/ui/styles.css">
  <!-- "three" zeigt auf die lokale Kopie in /lib → läuft auch ohne Internet -->
  <script type="importmap">
    { "imports": { "three": "./lib/three.module.js" } }
  </script>
</head>
<body>
  <!-- Hier landet das 3D-Bild -->
  <div id="game"></div>

  <!-- Anzeigen über dem 3D-Bild -->
  <div id="ui">
    <div id="fps" class="fps" hidden></div>
    <div id="info" class="panel info">
      <div class="info-title">Phase 1 · Leere Szene</div>
      <div class="info-row"><span class="swatch swatch-figure"></span>Figur: 1,8 m groß (gelber Ring = Kopf-Zone)</div>
      <div class="info-row"><span class="swatch swatch-cell"></span>Kasten: eine Bau-Zelle, 4 × 4 × 4 m</div>
      <div class="info-hint">Maus ziehen = Kamera drehen · Mausrad = Zoom</div>
    </div>
  </div>

  <!-- Ladebildschirm (verschwindet, sobald das erste Bild fertig ist) -->
  <div id="loading" class="loading">
    <div class="loading-title">BuildDuel</div>
    <div class="loading-bar"><div class="loading-bar-fill"></div></div>
    <div id="loading-tip" class="loading-tip">Wer höher steht, gewinnt meistens.</div>
  </div>

  <!-- Fehler-Anzeige (normalerweise unsichtbar) -->
  <div id="error" class="error-screen" hidden>
    <div class="panel error-panel">
      <div id="error-title" class="error-title">Fehler</div>
      <div id="error-text" class="error-text"></div>
      <pre id="error-details" class="error-details"></pre>
      <div class="error-hint">Tipp: Mach einen Screenshot von dieser Meldung und schick ihn an Claude.</div>
      <button id="error-close" class="error-close" type="button" hidden>Meldung schließen</button>
    </div>
  </div>

  <noscript>
    <div class="error-screen"><div class="panel error-panel">
      <div class="error-title">JavaScript ist ausgeschaltet</div>
      <div class="error-text">Bitte JavaScript im Browser einschalten.</div>
    </div></div>
  </noscript>

  <!-- Läuft vor dem Spiel: Fehler verständlich anzeigen + Tipps beim Laden -->
  <script>
    (function () {
      var body = document.body;
      var fatalShown = false;

      // closable = true: Das Spiel läuft weiter, die Meldung darf weggeklickt werden.
      function show(title, text, details, closable) {
        // Nur die ERSTE Meldung zeigen – sie ist meistens die eigentliche Ursache.
        // Ausnahme: Eine schwere Meldung (Spiel steht) ersetzt eine harmlose.
        if (body.classList.contains('has-error') && (fatalShown || closable)) return;
        if (!closable) fatalShown = true;
        document.getElementById('error-title').textContent = title;
        document.getElementById('error-text').textContent = text || '';
        document.getElementById('error-details').textContent = details || '';
        document.getElementById('error-close').hidden = !closable;
        document.getElementById('error').hidden = false;
        body.classList.add('has-error');
      }

      document.getElementById('error-close').addEventListener('click', function () {
        document.getElementById('error').hidden = true;
        body.classList.remove('has-error');
      });

      // Wird auch von src/main.js benutzt.
      window.showFatalError = function (title, error) {
        var text = error && error.message ? error.message : String(error || '');
        var details = error && error.stack ? error.stack : '';
        show(title, text, details, false);
      };

      // Dateiname ohne "http://localhost:8000/" davor
      function shortName(url) {
        return String(url || '').replace(location.origin + '/', '');
      }

      // Fall 1: index.html wurde direkt per Doppelklick geöffnet (file://)
      if (location.protocol === 'file:') {
        show(
          'Bitte über start.bat starten',
          'Du hast index.html direkt geöffnet. So blockiert der Browser aus Sicherheitsgründen ' +
          'die Spiel-Dateien. Schließ diesen Tab und starte das Spiel mit einem Doppelklick auf ' +
          'start.bat im Ordner BuildDuel. Dann öffnet sich der Browser von selbst.',
          'Adresse jetzt: ' + location.href + '\nRichtig wäre: http://localhost:8000',
          false
        );
        return;
      }

      // Fall 2: unerwartete Fehler im Spiel
      window.addEventListener('error', function (event) {
        // Fehler von fremden Skripten (z. B. Browser-Erweiterungen) ignorieren
        if (event.message === 'Script error.') return;
        if (event.filename && event.filename.indexOf(location.origin) !== 0) return;

        var file = shortName(event.filename) || (event.filename ? 'index.html' : '');
        var where = file ? file + (event.lineno ? ', Zeile ' + event.lineno : '') : '';
        var started = body.classList.contains('ready');

        // Häufigster Fall beim Werte-Ändern: Tippfehler in config.js
        if (/SyntaxError/.test(event.message)) {
          show('Tippfehler in ' + (file || 'einer Datei') + (event.lineno ? ' (Zeile ' + event.lineno + ')' : ''),
            'Die Datei enthält einen Schreibfehler. Häufige Ursachen: Komma statt Punkt bei ' +
            'Kommazahlen (8.4 statt 8,4), ein fehlendes Komma am Zeilenende oder ein fehlendes ' +
            'Anführungszeichen. Tipp: In der Datei Strg + Z (rückgängig), speichern, dann F5.',
            event.message + (where ? '\n' + where : ''), false);
          return;
        }
        var stack = event.error && event.error.stack ? event.error.stack : '';
        show('Unerwarteter Fehler', event.message,
          where + (where && stack ? '\n\n' : '') + stack, started);
      });
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason || {};
        show('Unerwarteter Fehler', reason.message || String(reason), reason.stack || '',
          body.classList.contains('ready'));
      });

      // Wechselnde Tipps auf dem Ladebildschirm
      var tipBox = document.getElementById('loading-tip');
      var tips = [
        'Wer höher steht, gewinnt meistens.',
        'Eine Wand vor dir fängt Schüsse sofort ab.',
        'Holz baut sich am schnellsten auf.',
        'Alle Spielwerte stehen in src/config.js.',
      ];
      var i = 0;
      var timer = setInterval(function () {
        if (body.classList.contains('ready')) { clearInterval(timer); return; }
        i = (i + 1) % tips.length;
        tipBox.textContent = tips[i];
      }, 2500);

      // Fall 3: Spiel lädt nach 15 Sekunden immer noch nicht → Hinweis auf dem
      // Ladebildschirm (verschwindet von selbst, falls das Spiel doch noch startet)
      setTimeout(function () {
        if (body.classList.contains('ready') || body.classList.contains('has-error')) return;
        clearInterval(timer);
        tipBox.classList.add('loading-slow');
        tipBox.textContent = 'Das dauert ungewöhnlich lange. Ist das schwarze start.bat-Fenster noch offen? ' +
          'Ein sehr alter Browser kann auch der Grund sein – bitte Chrome, Edge oder Firefox aktualisieren.';
      }, 15000);
    })();
  </script>

  <!-- Das eigentliche Spiel. onerror: eine Datei fehlt oder der Server liefert sie falsch aus. -->
  <script type="module" src="src/main.js"
    onerror="window.showFatalError && window.showFatalError('Spiel-Dateien fehlen', { message: 'Eine Spiel-Datei konnte nicht geladen werden. Welche, steht im schwarzen start.bat-Fenster in der Zeile „Hinweis: … Fehler 404“. Meist hilft: die ZIP-Datei nochmal mit „Alle extrahieren“ entpacken und start.bat im neuen Ordner starten.' })"></script>
</body>
</html>
