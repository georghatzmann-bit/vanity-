[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
authors = ["AEGIS Suite"]
repository = "https://github.com/georghatzmann-bit/vanity-"

[workspace.dependencies]
# Interne Crates
aegis-core = { path = "crates/core" }
aegis-engine = { path = "crates/engine" }
aegis-sandbox = { path = "crates/sandbox" }
aegis-hardening = { path = "crates/hardening" }
aegis-netwatch = { path = "crates/netwatch" }
aegis-vault-core = { path = "crates/vault-core" }
aegis-tools = { path = "crates/tools" }
aegis-defender-switch = { path = "crates/defender-switch" }

# Externe Crates (Versionen zentral gepflegt)
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
sha2 = "0.11.1"
blake3 = "1.8.7"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zeroize = { version = "1.9.1", features = ["derive"] }
tauri = { version = "2.12.4", features = [] }
tauri-build = { version = "2.7.3", features = [] }
tempfile = "3.27.0"
proptest = "1.12.0"

[workspace.lints.rust]
# unsafe nur gezielt (Windows-FFI) mit lokalem #[allow(unsafe_code)] + SAFETY-Kommentar.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
