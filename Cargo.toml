[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri", "apps/browser/src-tauri", "apps/setup/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
authors = ["AEGIS Suite"]
repository = "https://github.com/georghatzmann-bit/vanity-"

[workspace.dependencies]
# Interne Crates
aegis-core = { path = "crates/core" }
aegis-engine = { path = "crates/engine" }
aegis-sandbox = { path = "crates/sandbox" }
aegis-hardening = { path = "crates/hardening" }
aegis-netwatch = { path = "crates/netwatch" }
aegis-vault-core = { path = "crates/vault-core" }
aegis-vault-host = { path = "crates/vault-host" }
aegis-tools = { path = "crates/tools" }
aegis-browser-core = { path = "crates/browser-core" }
aegis-update = { path = "crates/update" }
aegis-defender-switch = { path = "crates/defender-switch" }
aegis-quarantine = { path = "crates/quarantine" }
aegis-winffi = { path = "crates/winffi" }

# Externe Crates (Versionen zentral gepflegt)
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
sha2 = "0.11.1"
base64 = "0.22.1"
blake3 = "1.8.7"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
# Privacy-Browser (P12): Filterlisten im Adblock-Plus-Format (Brave, MPL-2.0) und Adressen.
adblock = { version = "0.13.3", default-features = false, features = [
  "embedded-domain-resolver",
  "full-regex-handling",
] }
url = "2.5.8"
# Signierte Updates (P13): Ed25519-Signatur des Update-Manifests.
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["zeroize"] }
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zeroize = { version = "1.9.1", features = ["derive"] }
tauri = { version = "2.12.4", features = [] }
tauri-build = { version = "2.7.3", features = [] }
# Desktop-App: nur eine Instanz (zweiter Start holt das vorhandene Fenster nach vorn).
tauri-plugin-single-instance = "2.5.4"
# Desktop-App: Datei-/Ordnerauswahl für Scans (nur „open“ freigegeben).
tauri-plugin-dialog = "2.8.3"
# Desktop-App, nur Windows: native Fehlermeldung, falls die App nicht starten kann
# (MessageBoxW ohne eigenes `unsafe`; dieselbe Bibliothek nutzt Tauris Dialog-Plugin).
# Ohne Standard-Features: die sind nur für Linux (xdg-portal/Wayland).
rfd = { version = "0.17.2", default-features = false }
# Desktop-App, nur Windows: Windows-Version für `app_info` (nur lesend, RtlGetVersion);
# ohnehin über tao/wry im Abhängigkeitsbaum.
windows-version = "0.1.7"
# Engine (P2): PE-Parser ohne Standard-Features (nur PE), YARA-X für Regeln.
goblin = { version = "0.10.7", default-features = false, features = ["std", "pe32", "pe64"] }
# Nur benötigte Module (ohne crx/vt/Test-Module). Ab P3 zusätzlich vba/olecf/zip für
# Office-Makros (VBA-Quelltext aus OLE- und OOXML-Dateien).
yara-x = { version = "1.21.0", default-features = false, features = [
  "constant-folding", "exact-atoms", "fast-regexp", "generate-proto-code",
  "pe-module", "dotnet-module", "elf-module", "lnk-module", "macho-module",
  "math-module", "hash-module", "string-module", "time-module", "console-module",
  "vba-module", "olecf-module", "zip-module",
] }
# Archive (P3): nur Lesen/Entpacken in den Speicher, mit Grenzen gegen Zip-Bomben.
# Ohne Verschlüsselung → passwortgeschützte Archive werden als „nicht prüfbar“ gemeldet.
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2", "deflate64"] }
sevenz-rust2 = { version = "0.24.1", default-features = false }
cab = "0.6.0"
flate2 = "1.1.10"
tar = { version = "0.4.46", default-features = false }
# Echtzeit-Wächter (P3): Dateiänderungen (ReadDirectoryChangesW/inotify) und Prozessstarts (ETW).
notify = { version = "8.2.0", default-features = false }
ferrisetw = "1.2.0"
# Härtung (P6): WMI-Abfragen (nur lesend) – BitLocker, TPM, Defender, Sicherheitscenter.
wmi = { version = "0.18.4", default-features = false }
# Quarantäne (P2): AES-256-GCM, Zufall aus dem Betriebssystem.
aes-gcm = "0.11.1"
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }
getrandom = "0.4.3"
# Dienst (P2): Windows-API für Named Pipe mit Zugriffsliste und geschützten Datenordner;
# Dienststeuerung (SCM).
windows-sys = "0.61.2"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
] }
windows-core = "0.62.2"
webview2-com = "0.39.1"
windows-service = "0.8.1"
tempfile = "3.27.0"
proptest = "1.12.0"
trybuild = "1.0.122"
# Nur für Tests (mutation_guard): Konfiguration wie Cargo/Clippy lesen statt Textsuche.
# Dieselbe Version, die trybuild ohnehin zieht.
toml = "1.1.8"

[workspace.lints.rust]
# unsafe nur gezielt (Windows-FFI) mit lokalem #[allow(unsafe_code)] + SAFETY-Kommentar.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

# Entwicklung/Tests: nur Zeilen-Infos für eigene Crates, keine Debug-Infos für Fremd-Crates.
# Jede Test-Binärdatei enthält YARA-X/wasmtime – mit voller Debug-Info wären es Gigabytes.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Argon2id (Datei-Safe) ist ohne Optimierung in Tests sehr langsam.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
