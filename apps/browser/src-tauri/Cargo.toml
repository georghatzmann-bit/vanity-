[package]
name = "aegis-browser"
description = "AEGIS Suite – Privacy-Browser (Tauri 2, WebView2): Tabs, Tracker-Blocker, HTTPS-only, DoH, Ghost-Modus."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true

[[bin]]
name = "aegis-browser"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
# unstable: mehrere WebViews in einem Fenster (eine Leiste oben, je Tab ein WebView darunter).
tauri = { workspace = true, features = ["unstable"] }
aegis-browser-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }

[target.'cfg(windows)'.dependencies]
aegis-winffi = { workspace = true }

[lints]
workspace = true
