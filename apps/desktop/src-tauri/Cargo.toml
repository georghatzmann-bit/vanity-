[package]
name = "aegis-desktop"
description = "AEGIS Suite – Desktop-App (Tauri 2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true

[[bin]]
name = "aegis"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
aegis-core = { workspace = true }
# tray-icon: Symbol im Infobereich (wird im Code angelegt, nicht über tauri.conf.json).
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-single-instance = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }

[target.'cfg(windows)'.dependencies]
rfd = { workspace = true }
windows-version = { workspace = true }

[dev-dependencies]
aegis-core = { workspace = true, features = ["testing"] }
# Nur für Tests: Tauris Test-Laufzeit (prüft die echten IPC-Rechte ohne Fenster).
tauri = { workspace = true, features = ["tray-icon", "test"] }
tempfile = { workspace = true }

[lints]
workspace = true
