[package]
name = "aegis-desktop"
description = "AEGIS Suite – Desktop-App (Tauri 2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true

[[bin]]
name = "aegis"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
# tray-icon: Symbol im Infobereich (wird im Code angelegt, nicht über tauri.conf.json).
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-dialog = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
# Heimnetz-Scanner: reine Einordnung (Subnetz, Hinweise).
aegis-netwatch = { workspace = true }
# Passwort-Tresor (P9).
aegis-vault-core = { workspace = true }
# Windows-Tools (P10): Vorschau, Protokoll, Rückgängig.
aegis-tools = { workspace = true }
# Signierte Updates (P13).
aegis-update = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(windows)'.dependencies]
aegis-winffi = { workspace = true }
# Nur PNG-Kodierung der Fensterfotos der Mini-Sandbox (Labor, Stufe 2).
aegis-sandbox = { workspace = true }
base64 = { workspace = true }
rfd = { workspace = true }
windows-version = { workspace = true }

[dev-dependencies]
# Nur Testcode nutzt aegis-core (Fixtures über aegis_core::testing). Der Produktivcode braucht
# es erst, wenn er Aktionspläne/Freigaben verarbeitet – dann gehört es unter [dependencies].
aegis-core = { workspace = true, features = ["testing"] }
# Nur für Tests: Tauris Test-Laufzeit (prüft die echten IPC-Rechte ohne Fenster).
tauri = { workspace = true, features = ["tray-icon", "test"] }
tempfile = { workspace = true }

[lints]
workspace = true
