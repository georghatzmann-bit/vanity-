allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true

# Goldene Regel: Verändernde std-APIs sind gesperrt. Eine Ausnahme braucht
#   1. `#[allow(clippy::disallowed_methods)]` so eng wie möglich (am Ausdruck/Statement),
#   2. direkt darüber die Markierung `// aegis-mutation: <kennung>`,
#   3. den Eintrag `<datei> :: <kennung> :: <begründung>` in crates/core/mutation-allowlist.txt.
# Der Test crates/core/tests/mutation_guard.rs erzwingt das; das Security-Review prüft jede Ausnahme.
#
# Dateien öffnen: Gesperrt sind nicht `OpenOptions::open` (das braucht auch reines Lesen,
# etwa mit Freigabe-Modi unter Windows), sondern alle Schalter, die Schreibzugriff,
# Anlegen oder Kürzen bewirken. Ohne einen gesperrten Schalter öffnet `open` nur lesend.
# Plattform-Pfade tragen `allow-invalid = true`, weil es sie auf der jeweils anderen
# Plattform nicht gibt (sonst warnt Clippy dort über einen ungültigen Pfad).
