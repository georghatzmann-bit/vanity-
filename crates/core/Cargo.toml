[package]
name = "aegis-core"
description = "Gemeinsame Grundtypen: Goldene Regel (Freigabe-Tor), Aktionspläne, Prüfprotokoll, Risikostufen."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true

[features]
default = []
# Test-Hilfen für alle Crates (DirSnapshot, ManualClock, write_fixture, eicar).
# Nur als dev-dependency aktivieren: `aegis-core = { workspace = true, features = ["testing"] }`.
testing = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }

[dev-dependencies]
# Selbst-Abhängigkeit: schaltet `testing` für die Integrationstests in `tests/` ein,
# damit auch ein schlichtes `cargo test --workspace` (ohne --all-features) alles prüft.
aegis-core = { workspace = true, features = ["testing"] }
proptest = { workspace = true }
trybuild = { workspace = true }
tempfile = { workspace = true }
# Für die Compile-Fail-Tests (tests/ui) direkt nutzbar:
serde_json = { workspace = true }
time = { workspace = true }

[lints]
workspace = true
