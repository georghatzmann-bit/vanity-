[package]
name = "aegis-service"
description = "Windows-Dienst aegis-service: Scans, Quarantäne, Freigabe-Tor und Prüfprotokoll hinter einer Named Pipe mit Zugriffsliste."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true

[dependencies]
aegis-core = { workspace = true }
aegis-engine = { workspace = true }
aegis-hardening = { workspace = true }
aegis-quarantine = { workspace = true }
aegis-sandbox = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }
notify = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
aegis-core = { workspace = true, features = ["testing"] }
goblin = { workspace = true }
tempfile = { workspace = true }


[target.'cfg(windows)'.dependencies]
aegis-winffi = { workspace = true }
ferrisetw = { workspace = true }
windows-service = { workspace = true }

[lints]
workspace = true
