<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>J.A.R.V.I.S.</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body data-state="idle" data-link="wait">
  <div class="backdrop" aria-hidden="true">
    <div class="backdrop-hex"></div>
    <div class="backdrop-scan"></div>
  </div>

  <div class="app" id="app">
    <!-- Kopfzeile: System links, Marke Mitte, Uhr rechts -->
    <header class="topbar">
      <section class="panel hud sys" aria-label="Systemstatus">
        <div class="panel-head">
          <span class="panel-title">System</span>
          <span class="rule"></span>
          <span class="link" id="linkTag"><i class="link-dot"></i><span id="linkText">Verbinde …</span></span>
        </div>
        <div class="meters">
          <div class="meter" id="cpuMeter">
            <span class="meter-label">CPU</span>
            <span class="meter-track"><span class="meter-fill"></span></span>
            <span class="meter-value">– %</span>
          </div>
          <div class="meter" id="ramMeter">
            <span class="meter-label">RAM</span>
            <span class="meter-track"><span class="meter-fill"></span></span>
            <span class="meter-value">– %</span>
          </div>
        </div>
        <div class="sys-lines">
          <div class="sys-line" id="micLine" hidden><span class="k">Mikrofon:</span> <span class="v" id="micName"></span></div>
          <div class="sys-line" id="modelLine" hidden><span class="k">Modell:</span> <span class="v" id="modelName"></span></div>
        </div>
      </section>

      <div class="brand" aria-hidden="true">
        <div class="brand-name">J.A.R.V.I.S.</div>
        <div class="brand-sub">Just A Rather Very Intelligent System</div>
        <div class="brand-ver" id="versionTag"></div>
      </div>

      <section class="clock" aria-label="Uhrzeit und Datum">
        <div class="clock-time"><span id="clockHM">--:--</span><span class="clock-sec" id="clockS">--</span></div>
        <div class="clock-date" id="clockDate"></div>
        <div class="clock-weather" id="weatherLine" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 2.6v1.3M3.3 8.9h1.3M5 4.9l.9.9M13 4.9l-.9.9"/><path d="M6.2 11.6a3.4 3.4 0 1 1 6.1-3.4"/><path d="M8 20.2h9.4a3.4 3.4 0 0 0 .3-6.8 4.8 4.8 0 0 0-9.2 1.3A2.8 2.8 0 0 0 8 20.2z"/></svg>
          <span id="weatherText"></span>
        </div>
      </section>
    </header>

    <!-- Bühne mit Arc Reactor -->
    <main class="stage">
      <div class="reactor-wrap" id="reactorWrap" role="button" tabindex="0" title="Klicken: Jarvis hört sofort zu (ohne „Hey Jarvis“)" aria-label="Jarvis sofort zuhören lassen">
        <canvas id="reactor" aria-hidden="true"></canvas>
      </div>
      <div class="status" aria-live="polite">
        <div class="state-label" id="stateLabel">Bereit</div>
        <div class="state-hint" id="stateHint">Sag „Hey Jarvis“ oder klick auf den Reaktor</div>
      </div>
    </main>

    <!-- Verlauf -->
    <aside class="panel hud chat" aria-label="Verlauf">
      <div class="panel-head">
        <span class="panel-title">Verlauf</span>
        <span class="rule"></span>
        <span class="panel-meta" id="msgCount"></span>
      </div>
      <div class="chat-body">
        <div class="messages" id="messages" role="log" aria-live="polite" aria-relevant="additions text"></div>
        <div class="chat-empty" id="chatEmpty">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-4.5 4v-4A1.5 1.5 0 0 1 4 14.5z"/><path d="M8.5 8.5h7M8.5 11.5h4.5"/></svg>
          <p>Noch keine Unterhaltung.</p>
          <p class="sub">Sag „Hey Jarvis“ oder probier eins davon:</p>
          <div class="try" id="tryList">
            <button type="button" class="try-chip">Wie spät ist es?</button>
            <button type="button" class="try-chip">Wie wird das Wetter morgen?</button>
            <button type="button" class="try-chip">Erinnere mich in 10 Minuten an den Tee</button>
            <button type="button" class="try-chip">Öffne YouTube</button>
          </div>
        </div>
      </div>
    </aside>

    <!-- Eingabe und Steuerung -->
    <footer class="dock">
      <form class="panel hud cmd" id="cmdForm" autocomplete="off">
        <span class="cmd-prompt" aria-hidden="true">›</span>
        <input id="cmdInput" type="text" placeholder="Schreib Jarvis etwas …" maxlength="2000" spellcheck="false" aria-label="Nachricht an Jarvis">
        <button type="submit" class="send-btn" id="sendBtn" title="Senden (Enter)" aria-label="Senden" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 3.5 10.2 13.8"/><path d="M20.5 3.5 14 20.5l-3.8-6.7L3.5 10z"/></svg>
          <span class="send-text">Senden</span>
        </button>
      </form>
      <div class="ctrl" role="group" aria-label="Steuerung">
        <button type="button" class="icon-btn" id="micBtn" title="Stumm/Laut" aria-label="Stumm/Laut" aria-pressed="false">
          <svg class="ico-mic" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11.5" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"/><path d="M12 18v3M8.5 21h7"/></svg>
          <svg class="ico-mic-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 10V6a3 3 0 0 0-5.7-1.3"/><path d="M9 9v2.5a3 3 0 0 0 4.9 2.3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 10.4 5.2M18.5 11.5a6.4 6.4 0 0 1-.6 2.7"/><path d="M12 18v3M8.5 21h7"/><path d="M3.5 3.5l17 17"/></svg>
        </button>
        <button type="button" class="icon-btn" id="stopBtn" title="Stopp" aria-label="Stopp">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="6.5" width="11" height="11" rx="2"/></svg>
        </button>
        <button type="button" class="icon-btn" id="newBtn" title="Neue Unterhaltung" aria-label="Neue Unterhaltung">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-4.5 4v-4A1.5 1.5 0 0 1 4 14.5z"/><path d="M12 6.5v6M9 9.5h6"/></svg>
        </button>
        <button type="button" class="icon-btn" id="setupBtn" title="Einrichtung: Mikrofon, Stimme, Wohnort, Claude, Extras" aria-label="Einrichtung öffnen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M21.2 12h-2.4M5.2 12H2.8M18.5 5.5l-1.7 1.7M7.2 16.8l-1.7 1.7M18.5 18.5l-1.7-1.7M7.2 7.2 5.5 5.5"/><circle cx="12" cy="12" r="6.6"/></svg>
        </button>
      </div>
    </footer>
  </div>

  <div class="toasts" id="toasts" aria-live="assertive"></div>

  <script src="app.js"></script>
</body>
</html>
