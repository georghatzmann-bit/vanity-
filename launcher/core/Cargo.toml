[package]
name = "niobium-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-only"
description = "Niobium – platform-independent logic: version detection, log parsing, crash analysis, profiles, Bubble Builds"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"

[target.'cfg(windows)'.dependencies]
pelite = "0.10"
