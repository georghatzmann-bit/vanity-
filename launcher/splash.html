<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Niobium</title>
    <!--
      Splash window (tauri.conf.json, label "splash", 440 x 300, transparent, no frame).
      CSS only, no scripts and no Tauri calls: Rust closes it when the main window is ready (app_ready).
      Sequence (docs/brand.md): tile pops in (0 ms) → glow (250 ms) → sheen sweep (450 ms) →
      wordmark (500 ms) → tagline (650 ms) → loading line loops until the launcher is ready.
    -->
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        cursor: default;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        position: relative;
        box-sizing: border-box;
        width: 400px;
        height: 260px;
        border-radius: 22px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(120% 90% at 50% -10%, rgb(85 70 255 / 0.28), transparent 60%),
          radial-gradient(60% 50% at 100% 100%, rgb(255 200 87 / 0.07), transparent 70%),
          #0a0b12;
        box-shadow:
          inset 0 1px 0 rgb(255 255 255 / 0.08),
          inset 0 0 0 1px rgb(255 255 255 / 0.07),
          0 12px 28px -8px rgb(0 0 0 / 0.7);
        animation: card-in 420ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      /* fine dot grid like in the launcher */
      .card::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: radial-gradient(rgb(255 255 255 / 0.06) 1px, transparent 1px);
        background-size: 18px 18px;
        -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 30%, black 10%, transparent 75%);
        mask-image: radial-gradient(ellipse 70% 60% at 50% 30%, black 10%, transparent 75%);
        pointer-events: none;
      }

      .mark {
        position: relative;
        width: 92px;
        height: 92px;
        margin-top: 6px;
      }

      .glow {
        position: absolute;
        inset: -38%;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgb(122 60 255 / 0.62), rgb(43 91 255 / 0.3) 55%, transparent 100%);
        filter: blur(10px);
        opacity: 0;
        animation:
          glow-in 600ms ease-out 250ms forwards,
          breathe 3.6s ease-in-out 850ms infinite;
      }

      .tile {
        position: relative;
        width: 100%;
        height: 100%;
        animation: tile-in 760ms cubic-bezier(0.22, 1.25, 0.36, 1) both;
      }

      .tile svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* signature sheen: one diagonal light band across the tile (clipped to the tile's rounded square) */
      .sheen-clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
        clip-path: inset(6.25% round 20.3%);
      }

      .sheen {
        position: absolute;
        top: -10%;
        bottom: -10%;
        left: -60%;
        width: 50%;
        background: linear-gradient(90deg, transparent, rgb(255 255 255 / 0.32), transparent);
        transform: translateX(-60%) skewX(-30deg);
        animation: sweep 750ms cubic-bezier(0.16, 1, 0.3, 1) 450ms both;
      }

      .wordmark {
        display: block;
        height: 26px;
        width: auto;
        margin-top: 22px;
        fill: #f2f3f8;
        animation: rise 520ms cubic-bezier(0.16, 1, 0.3, 1) 500ms both;
      }

      .tagline {
        margin: 8px 0 0;
        font-size: 12px;
        letter-spacing: 0.01em;
        color: #a3a8c3;
        animation: rise 520ms cubic-bezier(0.16, 1, 0.3, 1) 650ms both;
      }

      /* loading line with the gold tip, loops until the launcher is ready */
      .bar {
        position: absolute;
        left: 50%;
        bottom: 26px;
        width: 120px;
        height: 2px;
        margin-left: -60px;
        border-radius: 2px;
        overflow: hidden;
        background: rgb(255 255 255 / 0.07);
        animation: fade 400ms ease-out 750ms both;
      }

      .bar span {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 45%;
        border-radius: 2px;
        background: linear-gradient(90deg, rgb(43 91 255 / 0), #2b5bff 25%, #7a3cff 70%, #ffc857 100%);
        box-shadow: 0 0 8px rgb(122 60 255 / 0.8);
        animation: load 1.3s cubic-bezier(0.65, 0, 0.35, 1) 750ms infinite;
        transform: translateX(-110%);
      }

      @keyframes card-in {
        from {
          opacity: 0;
          transform: scale(0.97);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes tile-in {
        from {
          opacity: 0;
          transform: scale(0.86);
          filter: blur(12px);
        }
        60% {
          filter: blur(0);
        }
        to {
          opacity: 1;
          transform: scale(1);
          filter: blur(0);
        }
      }

      @keyframes glow-in {
        to {
          opacity: 0.8;
        }
      }

      @keyframes breathe {
        0%,
        100% {
          opacity: 0.8;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.06);
        }
      }

      @keyframes sweep {
        from {
          transform: translateX(-60%) skewX(-30deg);
        }
        to {
          transform: translateX(460%) skewX(-30deg);
        }
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes load {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(240%);
        }
      }

      /* Windows "Show animations" off: only short fades, nothing moves or loops */
      @media (prefers-reduced-motion: reduce) {
        .card,
        .tile,
        .wordmark,
        .tagline,
        .bar {
          animation: fade 150ms ease-out both;
        }
        .glow {
          animation: none;
          opacity: 0.8;
        }
        .sheen {
          display: none;
        }
        .bar span {
          animation: none;
          transform: none;
          width: 100%;
          opacity: 0.6;
        }
      }
    </style>
  </head>
  <body>
    <main class="card" role="img" aria-label="Niobium is starting">

            <rect x="68" y="68" width="888" height="888" rx="204" fill="none" stroke="url(#sp-rim)" stroke-width="8"/>

            <path d="M184.5 382H276.5V750H184.5ZM408.5 382H500.5V750H408.5ZM184.5 382H288.55L500.5 750H396.45ZM537.5 382H629.5V750H537.5ZM537.5 613.84A151 136.16 0 1 1 839.5 613.84A151 136.16 0 1 1 537.5 613.84ZM629.5 613.84A59 57.04 0 1 0 747.5 613.84A59 57.04 0 1 0 629.5 613.84Z" fill="url(#sp-ink)" filter="url(#sp-shadow)"/>
          </svg>
          <span class="sheen-clip"><span class="sheen"></span></span>
        </div>
      </div>

      <p class="tagline">old seasons, new shine.</p>
