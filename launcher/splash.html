<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Niobium</title>
    <!--
      Splash window (tauri.conf.json, label "splash", 440 x 300, transparent, no frame).
      CSS only, no scripts and no Tauri calls: Rust closes it when the main window is ready (app_ready).
      Sequence (docs/brand.md): portal mark pops in (0 ms) → glow (250 ms) → sheen sweep (450 ms) →
      wordmark (500 ms) → tagline (650 ms) → loading line loops until the launcher is ready.
    -->
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        cursor: default;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        position: relative;
        box-sizing: border-box;
        width: 400px;
        height: 260px;
        border-radius: 22px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(120% 90% at 50% -10%, rgb(124 58 237 / 0.28), transparent 60%),
          radial-gradient(60% 50% at 100% 100%, rgb(34 211 238 / 0.07), transparent 70%),
          #07070c;
        box-shadow:
          inset 0 1px 0 rgb(255 255 255 / 0.08),
          inset 0 0 0 1px rgb(255 255 255 / 0.07),
          0 12px 28px -8px rgb(0 0 0 / 0.7);
        animation: card-in 420ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      /* fine dot grid like in the launcher */
      .card::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: radial-gradient(rgb(255 255 255 / 0.06) 1px, transparent 1px);
        background-size: 18px 18px;
        -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 30%, black 10%, transparent 75%);
        mask-image: radial-gradient(ellipse 70% 60% at 50% 30%, black 10%, transparent 75%);
        pointer-events: none;
      }

      .mark {
        position: relative;
        width: 92px;
        height: 92px;
        margin-top: 6px;
      }

      .glow {
        position: absolute;
        inset: -38%;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgb(139 92 246 / 0.62), rgb(34 211 238 / 0.3) 55%, transparent 100%);
        filter: blur(10px);
        opacity: 0;
        animation:
          glow-in 600ms ease-out 250ms forwards,
          breathe 3.6s ease-in-out 850ms infinite;
      }

      .tile {
        position: relative;
        width: 100%;
        height: 100%;
        animation: tile-in 760ms cubic-bezier(0.22, 1.25, 0.36, 1) both;
      }

      .tile svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* signature sheen: one diagonal light band across the mark (clipped to the portal circle) */
      .sheen-clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
        clip-path: circle(43.75% at 50% 50%);
      }

      .sheen {
        position: absolute;
        top: -10%;
        bottom: -10%;
        left: -60%;
        width: 50%;
        background: linear-gradient(90deg, transparent, rgb(255 255 255 / 0.32), transparent);
        transform: translateX(-60%) skewX(-30deg);
        animation: sweep 750ms cubic-bezier(0.16, 1, 0.3, 1) 450ms both;
      }

      .wordmark {
        display: block;
        height: 22px;
        width: auto;
        margin-top: 22px;
        fill: #f4f4f8;
        animation: rise 520ms cubic-bezier(0.16, 1, 0.3, 1) 500ms both;
      }

      .tagline {
        margin: 8px 0 0;
        font-size: 12px;
        letter-spacing: 0.01em;
        color: #a6a6bc;
        animation: rise 520ms cubic-bezier(0.16, 1, 0.3, 1) 650ms both;
      }

      /* loading line with the cyan tip, loops until the launcher is ready */
      .bar {
        position: absolute;
        left: 50%;
        bottom: 26px;
        width: 120px;
        height: 2px;
        margin-left: -60px;
        border-radius: 2px;
        overflow: hidden;
        background: rgb(255 255 255 / 0.07);
        animation: fade 400ms ease-out 750ms both;
      }

      .bar span {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 45%;
        border-radius: 2px;
        background: linear-gradient(90deg, rgb(139 92 246 / 0), #8b5cf6 25%, #7c6cf6 60%, #22d3ee 100%);
        box-shadow: 0 0 8px rgb(34 211 238 / 0.7);
        animation: load 1.3s cubic-bezier(0.65, 0, 0.35, 1) 750ms infinite;
        transform: translateX(-110%);
      }

      @keyframes card-in {
        from {
          opacity: 0;
          transform: scale(0.97);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes tile-in {
        from {
          opacity: 0;
          transform: scale(0.86);
          filter: blur(12px);
        }
        60% {
          filter: blur(0);
        }
        to {
          opacity: 1;
          transform: scale(1);
          filter: blur(0);
        }
      }

      @keyframes glow-in {
        to {
          opacity: 0.8;
        }
      }

      @keyframes breathe {
        0%,
        100% {
          opacity: 0.8;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.06);
        }
      }

      @keyframes sweep {
        from {
          transform: translateX(-60%) skewX(-30deg);
        }
        to {
          transform: translateX(460%) skewX(-30deg);
        }
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes load {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(240%);
        }
      }

      /* Windows "Show animations" off: only short fades, nothing moves or loops */
      @media (prefers-reduced-motion: reduce) {
        .card,
        .tile,
        .wordmark,
        .tagline,
        .bar {
          animation: fade 150ms ease-out both;
        }
        .glow {
          animation: none;
          opacity: 0.8;
        }
        .sheen {
          display: none;
        }
        .bar span {
          animation: none;
          transform: none;
          width: 100%;
          opacity: 0.6;
        }
      }
    </style>
  </head>
  <body>
    <main class="card" role="img" aria-label="Niobium is starting">
      <div class="mark">
        <div class="glow"></div>
        <div class="tile">

                <stop offset="0" stop-color="#B69CFF"/>

                <stop offset="0.62" stop-color="#7C6CF6"/>
                <stop offset="0.86" stop-color="#22D3EE"/>
              </linearGradient>
              <radialGradient id="sp-portal" cx="512" cy="512" r="386" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#2A1766"/>
                <stop offset="0.55" stop-color="#140D33"/>
                <stop offset="1" stop-color="#0B0A1A"/>
              </radialGradient>
              <linearGradient id="sp-core" x1="0" y1="40" x2="0" y2="990" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#22D3EE"/>
                <stop offset="0.5" stop-color="#67E8F9"/>
                <stop offset="1" stop-color="#A78BFA"/>
              </linearGradient>
              <mask id="sp-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
                <rect width="1024" height="1024" fill="#fff"/>
                <path d="M598 30L555.67 200.86L565.49 291.69L421.27 478.47L485.79 548.64L397.96 719L451.35 790.19L420.23 897.33L420 994L420 994L439.77 902.67L508.65 789.81L498.04 725L638.21 531.36L562.73 461.53L630.51 300.31L584.33 199.14L598 30Z" fill="#000" stroke="#000" stroke-width="44" stroke-linejoin="round"/>
              </mask>
              <radialGradient id="sp-bloom" cx="512" cy="512" r="386" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.55"/>
                <stop offset="0.6" stop-color="#8B5CF6" stop-opacity="0.12"/>
                <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
              </radialGradient>
              <filter id="sp-glow-wide" x="-60%" y="-30%" width="220%" height="160%" color-interpolation-filters="sRGB">
                <feGaussianBlur stdDeviation="70"/>
              </filter>
              <filter id="sp-glow" x="-60%" y="-30%" width="220%" height="160%" color-interpolation-filters="sRGB">
                <feGaussianBlur stdDeviation="26"/>
              </filter>
              <clipPath id="sp-inside"><circle cx="512" cy="512" r="387"/></clipPath>
            </defs>
            <circle cx="512" cy="512" r="417" fill="url(#sp-portal)"/>
            <circle cx="512" cy="512" r="386" fill="url(#sp-bloom)"/>
            <circle cx="512" cy="512" r="308.8" fill="none" stroke="#A78BFA" stroke-opacity="0.16" stroke-width="6"/>
            <circle cx="512" cy="512" r="223.88" fill="none" stroke="#A78BFA" stroke-opacity="0.11" stroke-width="6"/>
            <g clip-path="url(#sp-inside)"><path d="M598 30L555.67 200.86L565.49 291.69L421.27 478.47L485.79 548.64L397.96 719L451.35 790.19L420.23 897.33L420 994L420 994L439.77 902.67L508.65 789.81L498.04 725L638.21 531.36L562.73 461.53L630.51 300.31L584.33 199.14L598 30Z" fill="#8B5CF6" opacity="0.95" filter="url(#sp-glow-wide)"/></g>
            <circle cx="512" cy="512" r="417" fill="none" stroke="url(#sp-ring)" stroke-width="62" mask="url(#sp-cut)"/>
            <circle cx="512" cy="512" r="445" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="5" stroke-dasharray="774.09 2040.78" transform="rotate(-200 512 512)" mask="url(#sp-cut)"/>
            <path d="M598 30L555.67 200.86L565.49 291.69L421.27 478.47L485.79 548.64L397.96 719L451.35 790.19L420.23 897.33L420 994L420 994L439.77 902.67L508.65 789.81L498.04 725L638.21 531.36L562.73 461.53L630.51 300.31L584.33 199.14L598 30Z" fill="#22D3EE" filter="url(#sp-glow)"/>
            <path d="M563.13 548.44L667.66 504.93L720 528L720 528L668.34 495.07L556.87 531.56ZM468.43 492.16L371 515.72L326 486L326 486L369 524.28L471.57 507.84ZM449.43 716.58L372 760L372 760L454.57 727.42Z" fill="#67E8F9" opacity="0.85"/>
            <path d="M598 30L555.67 200.86L565.49 291.69L421.27 478.47L485.79 548.64L397.96 719L451.35 790.19L420.23 897.33L420 994L420 994L439.77 902.67L508.65 789.81L498.04 725L638.21 531.36L562.73 461.53L630.51 300.31L584.33 199.14L598 30Z" fill="url(#sp-core)"/>
            <path d="M598 30L562.83 200.43L581.75 293.85L456.63 474.23L523.89 544.32L422.98 720.5L465.68 790.09L425.11 898.67L420 994L420 994L434.89 901.33L494.32 789.91L473.02 723.5L600.11 535.68L527.37 465.77L614.25 298.15L577.17 199.57L598 30Z" fill="#FFFFFF"/>
          </svg>
          <span class="sheen-clip"><span class="sheen"></span></span>
        </div>
      </div>
      <svg class="wordmark" viewBox="0 27.25 222.98 72.75" aria-hidden="true" focusable="false">
        <path d="M0 100H15.04V74.56H28.22C28.27 74.56 28.32 74.56 28.37 74.56L41.26 100H57.37L42.77 71.73C50.93 67.97 55.76 60.74 55.76 51.12C55.76 36.47 45.51 27.25 29.1 27.25H0ZM15.04 62.5V39.75H28.17C36.13 39.75 41.06 44.19 41.06 51.12C41.06 58.06 36.13 62.5 28.22 62.5ZM86.08 27.25H71.04V100H86.08ZM102.92 100H117.96V70.51H151.06V58.01H117.96V40.14H153.5V27.25H102.92ZM163.85 40.14H185.92V100H200.96V40.14H222.98V27.25H163.85Z"/>
      </svg>
      <p class="tagline">old seasons, new shine.</p>
      <div class="bar"><span></span></div>
    </main>
  </body>
</html>
