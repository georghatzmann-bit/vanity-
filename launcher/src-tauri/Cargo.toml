[package]
name = "niobium-launcher"
version = "0.1.0"
description = "Niobium – launcher for OG Fortnite private servers"
authors = ["Georg Hatzmann"]
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.85"

[lib]
# Own name for the library, so it doesn't clash with the .exe on Windows
name = "niobium_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2.7"
tauri-plugin-dialog = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
niobium-core = { path = "../core" }
dirs = "7"
if-addrs = "0.15"
ureq = { version = "3", default-features = false, features = ["json"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_Memory",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_Security",
  "Win32_Storage_FileSystem",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
