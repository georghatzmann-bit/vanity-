[package]
name = "vanity-launcher"
version = "0.1.0"
description = "Vanity – Launcher für OG-Fortnite-Privatserver"
authors = ["Georg Hatzmann"]
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.85"

[lib]
# Eigener Name für die Bibliothek, damit sie unter Windows nicht mit der .exe kollidiert
name = "vanity_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
