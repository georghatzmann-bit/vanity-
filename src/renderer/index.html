<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; media-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>HELIX</title>
  <link rel="stylesheet" href="css/helix.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="titlebar">
    <div class="brand" aria-label="HELIX">
      <span class="brand-mark glyph" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16M17 4v16M7 14.5l10-5"/></svg></span>
      <span class="brand-word">HELIX</span>
      <span class="brand-sub">Fortnite-Tuning-Cockpit</span>
    </div>
    <div id="status" class="status" aria-live="polite"></div>
    <button id="btn-settings" class="icon-btn titlebar-btn" type="button" title="Einstellungen" aria-label="Einstellungen">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9a3 3 0 110 6 3 3 0 010-6zM19 12l2-1-2-4-2 .5-1.5-1.2L15 4h-4l-.5 2.3L9 7.5 7 7 5 11l2 1v1l-2 1 2 4 2-.5 1.5 1.2.5 2.3h4l.5-2.3 1.5-1.2 2 .5 2-4-2-1z"/></svg>
    </button>
  </header>

  <main id="stage" class="stage"></main>

  <div id="intro" class="intro" hidden aria-hidden="true">
    <div class="intro-inner">
      <span class="intro-mark glyph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16M17 4v16M7 14.5l10-5"/></svg></span>
      <span class="intro-word">HELIX</span>
      <span class="intro-line"></span>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>
</body>
</html>
