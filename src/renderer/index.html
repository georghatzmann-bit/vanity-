<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Konto-Retter</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 3D-Hintergrund (Partikel-Schild, Sterne, Polarlicht) -->
  <canvas id="fx-bg" aria-hidden="true"></canvas>
  <div class="bg-vignette" aria-hidden="true"></div>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-logo"><img src="img/icon.png" alt="" width="34" height="34"></span>
        <span class="brand-text">
          <span class="brand-name">Konto-Retter</span>
          <span class="brand-sub">Hilfe nach einem Epic-Hack</span>
        </span>
      </div>
      <nav class="nav" id="nav" aria-label="Hauptmenü">
        <span class="nav-indicator" id="nav-indicator" aria-hidden="true"></span>
      </nav>
      <div class="topbar-right" id="topbar-right"></div>
    </header>
    <main class="main" id="main" tabindex="-1"></main>
  </div>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <div class="modal-root" id="modal-root"></div>

  <script src="../shared/fields.js"></script>
  <script src="../shared/steps.js"></script>
  <script src="../shared/supportText.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/state.js"></script>
  <script src="views/recovery.js"></script>
  <script src="views/data.js"></script>
  <script src="views/pdf.js"></script>
  <script src="views/support.js"></script>
  <script src="views/accounts.js"></script>
  <script src="views/discord.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
