<!doctype html>
<html lang="de" data-accent="violet" data-motion="full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="dark">
  <title>VELOX</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237C5CFF'/%3E%3Cstop offset='1' stop-color='%2322D3EE'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M7 9h5l4 10 4-10h5l-7 15h-4z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="aurora" aria-hidden="true"><span class="a1"></span><span class="a2"></span><span class="a3"></span><span class="grain"></span></div>

  <div id="app" class="shell">
    <aside id="sidebar" class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 5.5h4.2l3.8 9.2 3.8-9.2H20L13.6 19.5h-3.2L4 5.5Z" fill="currentColor"/></svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">VELOX</span>
          <span class="brand-sub">PC Tweaker</span>
        </div>
      </div>
      <nav id="nav" class="nav" aria-label="Hauptmenü"></nav>
      <div class="sidebar-foot">
        <button id="sidebar-toggle" class="icon-btn sidebar-toggle" type="button" aria-label="Seitenleiste einklappen" data-tip="Seitenleiste">
          <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M9.5 4.5v15"/><path d="m15.5 10-2 2 2 2"/></svg>
          <span class="sidebar-toggle-label">Einklappen</span>
        </button>
      </div>
    </aside>

    <div class="main-col">
      <header class="topbar">
        <div class="topbar-title">
          <span id="topbar-icon" class="topbar-icon" aria-hidden="true"></span>
          <div class="topbar-text">
            <h1 id="topbar-title">VELOX</h1>
            <p id="topbar-desc"></p>
          </div>
        </div>
        <div class="topbar-right">
          <button id="palette-trigger" class="palette-trigger" type="button" aria-label="Befehlspalette öffnen (Strg+K)">
            <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.4-4.4"/></svg>
            <span class="pt-label">Suchen oder Befehl …</span>
            <span class="pt-kbd"><kbd>Strg</kbd><kbd>K</kbd></span>
          </button>
          <div id="mode-chips" class="mode-chips"></div>
        </div>
      </header>

      <main id="main" class="main" tabindex="-1">
        <div class="content">
          <div id="banners" class="banners"></div>
          <div id="view" class="view"></div>
        </div>
      </main>

      <div id="pending" class="pending" aria-hidden="true" role="region" aria-label="Vorgemerkte Änderungen">
        <div id="pending-pop" class="pending-pop" hidden></div>
        <div class="pending-inner">
          <button id="pending-list-btn" class="pending-info" type="button" aria-expanded="false" tabindex="-1">
            <span id="pending-count" class="pending-count">0</span>
            <span class="pending-texts">
              <span id="pending-label" class="pending-label">Änderungen vorgemerkt</span>
              <span id="pending-detail" class="pending-detail"></span>
            </span>
            <svg class="icon pending-chev" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 14.5 6-6 6 6"/></svg>
          </button>
          <div class="pending-actions">
            <button id="pending-discard" class="btn btn-ghost" type="button" tabindex="-1"><span class="btn-label">Verwerfen</span></button>
            <button id="pending-apply" class="btn btn-primary btn-brand" type="button" tabindex="-1" data-testid="pending-apply">
              <svg class="icon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2.8 4.8 13.2c-.3.4 0 .8.4.8H11l-1 7.2 8.2-10.4c.3-.4 0-.8-.4-.8H12l1-7.2Z"/></svg>
              <span class="btn-label">Anwenden</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="layers" class="layers"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <div id="splash" class="splash" role="status" aria-live="polite">
    <div class="splash-card">
      <div class="splash-logo" aria-hidden="true">
        <span class="splash-orbit"></span><span class="splash-orbit o2"></span>
        <svg viewBox="0 0 24 24" width="34" height="34"><path d="M4 5.5h4.2l3.8 9.2 3.8-9.2H20L13.6 19.5h-3.2L4 5.5Z" fill="currentColor"/></svg>
      </div>
      <div class="splash-name">VELOX</div>
      <p class="splash-text">Dein System wird analysiert</p>
      <div class="splash-progress"><div id="splash-bar" class="splash-bar"></div></div>
      <div class="splash-meta"><span id="splash-step">VELOX wird gestartet …</span><span id="splash-pct"></span></div>
      <p class="splash-hint">Beim ersten Start dauert das ein paar Sekunden. Es wird nichts verändert.</p>
    </div>
  </div>

  <div id="ended" class="ended" hidden></div>
</body>
</html>
